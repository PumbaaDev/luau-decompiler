[workspace]
resolver = "2"
# Default members: core lib, CLI, and the protector/compiler
default-members = [
    "crates/luau-core",
    "crates/luau-cli",
    "crates/luau-compiler",
]
members = [
    "crates/luau-core",
    "crates/luau-cli",
    "crates/luau-compiler",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
full_moon = { version = "2.1", features = ["luau"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

# Turn-key local SearXNG (keyless, unlimited, fully local metasearch) for Jep's research stack.
# Prereq: Docker Desktop (Windows) OR docker in a WSL2 distro. Then, from this dir:  docker compose up -d
# JSON API is then at:  http://localhost:8888/search?q=<query>&format=json
services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    restart: unless-stopped
